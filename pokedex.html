<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pokedex.css">
    <title>Pokedex</title>
</head>
<body>
    <h1>MAESTRO POKEMON: DANNA DEL ANGEL</h1>
    <img src="https://i.ytimg.com/vi/3cLbFhxYPFY/maxresdefault.jpg" width="800px" style="top:0px;">
    <input type="text" placeholder="Pikachu" id="pokeName" name="pokeName"
    class="placeholder"><br>
    <img src="https://pngimg.com/uploads/pokemon/pokemon_PNG93.png" alt="Pokemaster" id="pokeImg" width="500px"
    class="pokeImg"><br>

    <div id="pokeName" class="pokeimg1" style="left: 100px; top:200px; font-size: 15px;"></div>
    <div id="pokeHe" class="pokeimg1" style="left: 100px; top:220px; font-size: 15px;"></div>
    <div id="pokeWe" class="pokeimg1" style="left: 100px; top:240px; font-size: 15px;"></div>
    <div id="pokeType" class="pokeimg1" style="left: 100px; top:260px; font-size: 15px;"></div>
    <div id="pokeitem" class="pokeimg1" style="left: 100px; top:280px; font-size: 15px;"></div>
    <div id="pokemove1" class="pokeimg1" style="left: 100px; top:280px; font-size: 15px;"></div>
    <div id="pokemove2" class="pokeimg1" style="left: 100px; top:300px; font-size: 15px;"></div>
    <div id="pokemove3" class="pokeimg1" style="left: 100px; top:320px; font-size: 15px;"></div>
    <div id="pokemove4" class="pokeimg1" style="left: 100px; top:340px; font-size: 15px;"></div>

    <div id="pokeid" class="pokeImg1" style="left: 600px; top: 500px; font-size: 200px; color:yellowgreen;"></div>
    <div id="pokeorder" class="pokeImg1" style="left: 700px; top: 500px; font-size: 20px; color:rgb(209, 8, 8);"></div>

    <button onclick="fetchPokemon()" class="button">Presiona</button>
</body>
<div class="grafica">
    <canvas id="miCanvas"></canvas>
</div>
<script src="pokedex.js"></script>
<script src="Chart.js"></script>
</html>
